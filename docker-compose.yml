version: '3.8'

services:
  mongodb:
    image: mongo:5.0
    container_name: gameopz-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - gameopz-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gameopz-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password@mongodb:27017/gameopz?authSource=admin
      JWT_SECRET: your_jwt_secret_key_here
      PORT: 5000
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - gameopz-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gameopz-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - gameopz-network

volumes:
  mongodb_data:

networks:
  gameopz-network:
    driver: bridge
